<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des closers · Papa in Shape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style id="app-style">/* Papa in Shape Suivi des closers (maquette) : feuille de style */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#111111;color:#fff;font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{
  --bg:#111111;
  --grid:rgba(255,255,255,.032);
  --surface:#181818;
  --surface-2:#1e1e1e;
  --surface-3:#262626;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.16);
  --text:#ffffff;
  --text-2:rgba(255,255,255,.74);
  --text-3:#9b9fa7;
  --text-4:#6d717a;
  --accent:#03ffa3;
  --accent-deep:#00d98a;
  --accent-ink:#111111;
  --accent-soft:rgba(3,255,163,.12);
  --accent-line:rgba(3,255,163,.38);
  --s1:#03ffa3;
  --s2:#5b86ff;
  --s2-soft:rgba(91,134,255,.18);
  --s3:#ffa15c;
  --s3-soft:rgba(255,161,92,.18);
  --good:#5ee29a;
  --good-soft:rgba(94,226,154,.14);
  --warn:#ffa14a;
  --warn-soft:rgba(255,161,74,.14);
  --crit:#ff7b6b;
  --crit-soft:rgba(255,123,107,.14);
  --radius:18px;
  --radius-sm:12px;
  --pill:999px;
  --font:'Urbanist',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Urbanist',Georgia,'Times New Roman',serif;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}
body{background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/72px 72px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/72px 72px,
  var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--accent-deep);color:var(--accent-ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- barre haute ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(17,17,19,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1360px;margin:0 auto;padding:12px 28px 0;display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto;text-decoration:none}
.brand-mark{width:30px;height:30px;flex:0 0 auto}
.brand-logo{height:21px;width:auto;flex:0 0 auto;display:block}
.brand-name{font-weight:600;letter-spacing:.01em;font-size:17px;color:var(--text);line-height:1}
.demo-note{margin:14px 0 -10px;font-size:12px;letter-spacing:.02em;color:var(--text-4);text-align:right}
.brand-sub{font-family:var(--serif);font-style:italic;color:var(--text-3);font-size:14px;padding-left:12px;border-left:1px solid var(--line-strong);line-height:1}
.tabs{display:flex;align-items:center;gap:2px;margin-left:-8px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;order:3;flex-basis:100%;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 12px;border-radius:var(--pill);color:var(--text-3);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:color .15s,background .15s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.tab[aria-selected="true"] .dot{background:var(--accent-ink);opacity:.55}
.top-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--pill);border:1px solid var(--line-strong);color:var(--text);font-weight:500;line-height:1;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.26)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn-ghost{border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{border-color:transparent}
.btn-danger{color:var(--crit);border-color:rgba(255,123,107,.35)}
.btn-danger:hover{background:var(--crit-soft)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-icon{width:38px;height:38px;padding:0;justify-content:center;border-radius:50%}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- page ---------- */
.page{max-width:1360px;margin:0 auto;padding:26px 28px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:15px;line-height:1.2;margin:0 0 6px}
h1.title{font-size:30px;font-weight:300;letter-spacing:-.02em;margin:0;line-height:1.15;text-wrap:balance}
h1.title strong{font-weight:500}
.subtitle{color:var(--text-3);margin:8px 0 0;font-size:14px}
.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--pill);padding:3px}
.seg button{padding:7px 14px;border-radius:var(--pill);color:var(--text-3);font-weight:500;font-size:13px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--text)}
.seg button:hover{color:var(--text)}
.period-nav{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--pill);padding:3px}
.period-nav button{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.period-nav button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.period-nav .plabel{padding:0 10px;font-weight:500;font-size:13px;min-width:190px;text-align:center;white-space:nowrap}
.period-nav .plabel small{display:block;font-weight:400;color:var(--text-3);font-size:11px;line-height:1.2}

/* ---------- grille et cartes ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;min-width:0;position:relative}
.card.raised{background:linear-gradient(160deg,#1a1a1e,#141417)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:500;margin:0;letter-spacing:-.005em}
.card-kicker{font-family:var(--serif);font-style:italic;color:var(--text-3);font-size:13px;margin:2px 0 0;line-height:1.3}
.card-side{color:var(--text-3);font-size:12px;text-align:right;white-space:nowrap}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-9{grid-column:span 9}.span-12{grid-column:span 12}

/* ---------- objectif ---------- */
.goal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto auto;gap:0 26px;align-items:stretch}
.goal-block{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:8px;border-left:1px solid var(--line);padding-left:26px;min-width:0}
.goal-block.main{border-left:0;padding-left:0}
.goal-block .label{align-self:start}
.goal-block .hero{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;align-self:end;padding:6px 0 2px}
.goal-block .hero small{font-size:18px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-left:6px}
.goal-block .big{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.05;align-self:end;padding:6px 0 2px}
.goal-block .big small{font-size:13px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-left:6px}
.goal-block .lead{color:var(--text-2);margin:0;align-self:start;font-size:13.5px;line-height:1.45}
.goal-block .lead.muted{color:var(--text-3)}
.goal-block .meter{align-self:center;margin-top:4px}
.goal-block .meter-legend{align-self:start;margin-top:2px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);font-weight:500}
.dot-s1,.dot-s2,.dot-s3{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.dot-s1{background:var(--s1)}.dot-s2{background:var(--s2)}.dot-s3{background:var(--s3)}
.meter{position:relative;height:8px;border-radius:var(--pill);background:rgba(3,255,163,.14);overflow:hidden}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:var(--pill);background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.meter.warn{background:rgba(255,161,74,.16)}.meter.warn > i{background:var(--warn)}
.meter.crit{background:rgba(255,123,107,.16)}.meter.crit > i{background:var(--crit)}
.meter.good{background:rgba(94,226,154,.16)}.meter.good > i{background:var(--good)}
.meter .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.8}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--pill);font-size:12px;font-weight:500;line-height:1.2;border:1px solid transparent;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill-good{background:var(--good-soft);color:var(--good)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-crit{background:var(--crit-soft);color:var(--crit)}
.pill-neutral{background:rgba(255,255,255,.07);color:var(--text-2)}
.pill-accent{background:var(--accent-soft);color:var(--accent)}
.pill-outline{border-color:var(--line-strong);color:var(--text-2)}

/* ---------- tuiles KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.kpi .label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .value{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.kpi .value small{font-size:13px;color:var(--text-3);font-weight:400;letter-spacing:0;margin-left:6px;white-space:nowrap}
.kpi .sub{color:var(--text-3);font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi .sub b{color:var(--text-2);font-weight:500}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--crit)}.delta.flat{color:var(--text-3)}
.delta svg{width:11px;height:11px}
.kpi .spark{margin-top:auto;height:34px}
.kpi .spark svg{display:block;width:100%;height:34px;overflow:visible}

/* ---------- graphiques ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--text-3);font-variant-numeric:tabular-nums}
.chart .grid-line{stroke:rgba(255,255,255,.07);stroke-width:1}
.chart .axis{stroke:rgba(255,255,255,.14);stroke-width:1}
.chart .bar{cursor:pointer;transition:opacity .15s}
.chart .bar:hover,.chart .bar:focus{opacity:.85}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover ~ .crosshair,.chart .hit:focus ~ .crosshair{opacity:1}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{opacity:.12}
.chart .marker{stroke:var(--surface);stroke-width:2}
.chart .empty{fill:var(--text-4)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{height:2px;width:14px;border-radius:1px}
.tooltip{position:fixed;z-index:60;pointer-events:none;background:#0d0d0f;border:1px solid var(--line-strong);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text-2);box-shadow:var(--shadow);max-width:260px;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s;white-space:pre-line;line-height:1.45}
.tooltip.show{opacity:1}
.tooltip b{color:var(--text);font-weight:600}

/* entonnoir */
.funnel{display:flex;flex-direction:column;gap:10px}
.funnel-row{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px}
.funnel-row .fl{color:var(--text-2)}
.funnel-row .fb{height:22px;border-radius:0 6px 6px 0;position:relative;min-width:2px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.funnel-row .fv{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.funnel-step{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;gap:12px;font-size:11.5px;color:var(--text-4)}
.funnel-step span:nth-child(2){display:flex;align-items:center;gap:6px}
.funnel-step svg{width:10px;height:10px}
.fb-split{display:flex;gap:2px;height:22px}
.fb-split i{display:block;height:22px;min-width:2px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.fb-split i:last-child{border-radius:0 6px 6px 0}
.funnel-split-legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding-left:130px;font-size:11.5px;color:var(--text-3)}
.funnel-split-legend span{display:inline-flex;align-items:center;gap:6px}
.funnel-split-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* encaissement */
.cash-rows{display:flex;flex-direction:column;gap:12px}
.cash-row{display:grid;grid-template-columns:96px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:13px}
.cash-row .cn{display:flex;align-items:center;gap:8px;color:var(--text-2)}
.cash-row .cv{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-3);font-size:12px}
.cash-row .cv b{color:var(--text);font-weight:600;font-size:13px;display:block}

/* anneaux */
.donuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.donut-cell{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.donut-head{display:flex;flex-direction:column;gap:1px}
.donut-head b{font-weight:500;font-size:13.5px}
.donut-head b small{font-weight:400;color:var(--text-3);font-size:11px;margin-left:6px}
.donut-head span{color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.donut{width:100%;max-width:120px;height:auto;margin:2px auto;overflow:visible}
.donut circle{cursor:default;transition:opacity .15s}
.donut circle[data-tip]:hover,.donut circle[data-tip]:focus{opacity:.8}
.donut text{font-family:var(--font)}
.donut-legend{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--text-3)}
.donut-legend span{display:flex;align-items:center;gap:6px}
.donut-legend span b{margin-left:auto;color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.donut-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:0 0 auto}

/* avatar */
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.02em;flex:0 0 auto;background:var(--surface-3);color:var(--text)}
.avatar.lg{width:52px;height:52px;font-size:17px}

/* ---------- tableau ---------- */
.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table.t{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
table.t th{text-align:right;font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.total td{font-weight:600;border-top:1px solid var(--line-strong);border-bottom:0;background:rgba(255,255,255,.02)}
table.t td.name{font-weight:500}
table.t .who{display:flex;align-items:center;gap:10px}
table.t .who small{display:block;color:var(--text-3);font-weight:400;font-size:11.5px}
table.t .bar-cell{min-width:150px}
.inline-bar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.inline-bar i{display:inline-block;height:6px;border-radius:3px;background:var(--accent);min-width:2px}
.inline-bar i.s2{background:var(--s2)}
.muted{color:var(--text-3)}
.faint{color:var(--text-4)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(255,255,255,.03)}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--text-3);margin-left:6px;vertical-align:middle;letter-spacing:.03em;text-transform:uppercase}

/* ---------- journal ---------- */
.journal{display:flex;flex-direction:column;gap:12px}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:4px}
.entry-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.entry-head b{font-weight:600}
.entry-head .when{color:var(--text-3);font-size:12.5px}
.entry-stats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 8px}
.entry-stats span{font-size:12px;padding:3px 9px;border-radius:var(--pill);background:rgba(255,255,255,.06);color:var(--text-2);font-variant-numeric:tabular-nums}
.entry-note{margin:0;color:var(--text-2);max-width:68ch;white-space:pre-line}
.entry-note.empty{color:var(--text-4);font-style:italic}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;border-radius:var(--pill);border:1px solid var(--line-strong);color:var(--text-2);text-decoration:none;max-width:100%}
.link:hover{border-color:var(--accent-line);color:var(--text)}
.link svg{width:12px;height:12px;flex:0 0 auto;opacity:.7}
.link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-actions{margin-top:10px;display:flex;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:var(--pill);border:1px solid var(--line-strong);color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.chip:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .avatar{background:rgba(0,0,0,.18);color:var(--accent-ink)}
.chip .tag{margin-left:0}
.chip[aria-pressed="true"] .tag{background:rgba(0,0,0,.18);color:var(--accent-ink)}

/* ---------- statut EOD ---------- */
.eod-status{display:flex;gap:10px;flex-wrap:wrap}
.eod-item{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 9px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.eod-item .st{font-size:11.5px;color:var(--text-3)}
.eod-item.done{border-color:rgba(94,226,154,.35)}
.eod-item.done .st{color:var(--good)}
.eod-item.todo .st{color:var(--warn)}
.eod-item.rest{color:var(--text-2)}
.eod-item.rest svg{width:16px;height:16px;color:var(--text-3)}

/* ---------- closer hero ---------- */
.closer-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.closer-hero .who h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
.closer-hero .who p{margin:2px 0 0;color:var(--text-3)}
.closer-hero .right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- vides ---------- */
.empty-state{padding:34px 16px;text-align:center;color:var(--text-3)}
.empty-state b{display:block;color:var(--text);font-weight:500;margin-bottom:4px}

/* ---------- bandeau ---------- */
.banner{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--text-2);margin-bottom:18px;flex-wrap:wrap}
.banner .grow{flex:1 1 auto}
.banner.ro{border-color:rgba(255,161,74,.4)}

/* ---------- modale ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,6,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease}
.modal{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;box-shadow:var(--shadow);animation:rise .22s cubic-bezier(.2,.7,.2,1)}
.modal.narrow{width:min(560px,100%)}
.modal-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 26px 14px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
.modal-head p{margin:4px 0 0;color:var(--text-3);font-size:13px}
.modal-body{padding:20px 26px 8px}
.modal-foot{position:sticky;bottom:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 26px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .grow{flex:1 1 auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* formulaire */
.fieldset{border:0;padding:0;margin:0 0 18px}
.fieldset legend{padding:0;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.fieldset legend b{font-weight:500;font-size:14px}
.fieldset legend span{font-family:var(--serif);font-style:italic;color:var(--text-3);font-size:13px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.f-grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.f-grid.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.f-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.f-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.hint{margin:10px 0 0;color:var(--text-3);font-size:12.5px}
/* lignes produit */
.sales{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sale-line{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
.sale-line .sel{grid-column:2;background:var(--surface-3)}
.sale-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.sale-custom{grid-column:2;display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr);gap:10px}
.sale-custom .txt{height:42px}
.sale-more{grid-column:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.sale-more .field label{font-size:11.5px}
.sale-more input.date,.sale-more select.sel{height:38px;font-size:13px;background:var(--surface-3)}
.cancel{color:var(--crit)}
.sale em{font-style:normal;font-size:11px;color:var(--text-3);margin-left:2px}
.sale em.cancel{color:var(--crit)}
.sale.off{opacity:.6;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.sale.off em{text-decoration:none;display:inline-block}
tr.off td{color:var(--text-3)}
.sale-info{grid-column:2;font-size:12px;color:var(--text-3);min-height:0}
.sale-info:empty{display:none}
.sale-info b{color:var(--text-2);font-weight:500}
.sale-info .com{color:var(--accent);margin-left:6px}
.amount.pct::after{content:"%"}
.sale{display:inline-flex;align-items:center;gap:6px}
.sale i{width:7px;height:7px;border-radius:2px;display:inline-block;background:rgba(255,255,255,.35);flex:0 0 auto}
.sale.audit i{background:var(--s1)}.sale.asc i{background:var(--s3)}.sale.up i{background:var(--s2)}
.entry-stats span.warn,.sales-cell .sale.warn{color:var(--warn)}
.sales-cell{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.sales-cell .sale{color:var(--text-2);white-space:nowrap}
/* commissions */
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.com-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.com-tile{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.com-tile.main{border-color:var(--accent-line);background:var(--accent-soft)}
.com-tile b{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.com-tile .muted{font-size:12px}
table.t.com tr.now td{background:var(--accent-soft)}
table.t.com tr.past td{color:var(--text-3)}
.cat-group{margin:12px 0 6px}
.cat-group .label{display:inline-flex;align-items:center;gap:6px}
.product-add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end;margin-top:12px}
.product-add .seg{height:42px;align-items:center}
.product-add .seg button{padding:6px 10px}
.f-grid.amounts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.f-grid.amounts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--text-3);font-weight:500}
.stepper{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;align-items:center;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);overflow:hidden}
.stepper button{height:42px;color:var(--text-2);font-size:18px;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.stepper input{width:100%;height:42px;text-align:center;background:transparent;border:0;font-size:17px;font-weight:600;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;background:rgba(3,255,163,.06)}
.amount{position:relative}
.amount input{width:100%;height:42px;padding:0 40px 0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.amount input::-webkit-outer-spin-button,.amount input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount input:focus{border-color:var(--accent-line);outline:none}
.amount::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:11.5px;padding:3px 9px;border-radius:var(--pill);border:1px solid var(--line);color:var(--text-3);font-variant-numeric:tabular-nums}
.quick button:hover{border-color:var(--accent-line);color:var(--accent)}
textarea.ta{width:100%;min-height:92px;resize:vertical;padding:12px 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);line-height:1.5}
textarea.ta:focus{border-color:var(--accent-line);outline:none}
input.txt,input.date,select.sel{height:42px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-2);width:100%;color-scheme:dark}
input.txt:focus,input.date:focus,select.sel:focus{border-color:var(--accent-line);outline:none}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 38px;gap:8px;margin-bottom:8px;align-items:center}
.link-row button{height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.link-row button:hover{background:var(--crit-soft);color:var(--crit)}
.summary{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--accent-soft);border:1px solid var(--accent-line);font-size:13px;color:var(--text-2);flex-wrap:wrap}
.summary b{color:var(--text);font-weight:600}
.summary .warnline{width:100%;color:var(--warn);font-size:12.5px}
.who-select{display:flex;gap:8px;flex-wrap:wrap}
.form-top{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px;align-items:end;margin-bottom:18px}

/* réglages */
.set-row{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .n{display:flex;align-items:center;gap:10px;font-weight:500}
.set-head{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr);gap:12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);padding-bottom:6px}
.section{margin-bottom:22px}
.section h3{font-size:14px;font-weight:500;margin:0 0 4px}
.section p{margin:0 0 10px;color:var(--text-3);font-size:13px}
.about li{margin:0 0 6px;color:var(--text-2)}
.about ul{padding-left:18px;margin:0 0 12px}
.about h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:last-child{color:var(--text-2);text-align:right}

/* membres */
.members{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px}
.member{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.member:last-child{border-bottom:0}
.member .who{display:flex;align-items:center;gap:10px;font-weight:500}
.member .who small{display:block;color:var(--text-3);font-weight:400;font-size:11.5px}
.member.off .who{opacity:.5}
.member .who{flex:1 1 150px;min-width:0}
.member input.email{flex:1 1 170px;min-width:0;height:34px;padding:0 10px;font-size:12.5px;border-radius:9px}
.member .check{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);white-space:nowrap}
.member .check input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.viewer{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);padding-right:6px}
.viewer span small{display:block;font-size:10.5px;color:var(--text-3);line-height:1.1}
.banner.preview{border-color:var(--accent-line);background:var(--accent-soft)}
.banner.preview b{color:var(--text);font-weight:600}
.member-add{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr) auto;gap:10px;align-items:end}
.member-add .field.wide{grid-column:1 / span 3}
.member-add .seg{height:42px;align-items:center}
.member-add .seg button{padding:6px 12px}
@media (max-width:640px){.member-add{grid-template-columns:1fr 1fr}}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:70;background:#0d0d0f;border:1px solid var(--line-strong);color:var(--text);padding:12px 18px;border-radius:var(--pill);font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis,.kpis.five,.kpis.four{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span-3,.span-4,.span-5{grid-column:span 6}
  .span-7,.span-8,.span-9{grid-column:span 12}
}
@media (max-width:900px){
  .topbar-in{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px}
  .brand-sub{display:none}
  .tabs{order:3;flex-basis:100%;margin-left:0}
  .top-actions{margin-left:auto}
  .page{padding:18px 16px 70px}
  .goal{grid-template-columns:1fr;gap:18px}
  .goal-block{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
  .span-6{grid-column:span 12}
  .form-top{grid-template-columns:1fr}
  .period-nav .plabel{min-width:0}
}
@media (max-width:640px){
  .kpis,.kpis.five,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sale-line{grid-template-columns:1fr}
  .sale-line .sel,.sale-custom,.sale-more,.sale-info{grid-column:1}
  .sale-custom{grid-template-columns:1fr 1fr}
  .sale-more{grid-template-columns:1fr}
  .product-add{grid-template-columns:1fr}
  .kpi .value{font-size:24px}
  h1.title{font-size:24px}
  .goal-main .hero{font-size:36px}
  .funnel-row,.funnel-step{grid-template-columns:96px minmax(0,1fr) 54px}
  .funnel-split-legend{padding-left:108px}
  .f-grid.amounts.two{grid-template-columns:1fr}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-height:100vh;border-radius:22px 22px 0 0;width:100%}
  .modal-head,.modal-body,.modal-foot{padding-left:18px;padding-right:18px}
  .f-grid,.f-grid.five,.f-grid.six,.f-grid.four,.f-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .link-row{grid-template-columns:minmax(0,1fr) 38px;grid-auto-rows:auto}
  .link-row input:nth-child(2){grid-column:1 / span 2}
  .cash-row{grid-template-columns:80px minmax(0,1fr) 96px}
  .set-row,.set-head{grid-template-columns:100px minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  .topbar,.btn,.period,.tooltip{display:none!important}
  body{background:#fff;color:#000}
}

function avatar(c, lg) { var cl = memberOf(c); return '<span class="avatar' + (lg ? ' lg' : '') + '" style="background:' + cl.bg + ';color:' + cl.fg + '" aria-hidden="true">' + esc(cl.initials) + '</span>'; }

/* =========================================================
   7. Graphiques SVG
   ========================================================= */
function niceMax(v) {
  if (v <= 0) return 1;
  var p = Math.pow(10, Math.floor(Math.log10(v)));
  var m = v / p;
  var n = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 4 ? 4 : m <= 5 ? 5 : m <= 8 ? 8 : 10;
  return n * p;
}
/* echelle d'axe : un pas rond (1, 2, 2.5, 5 x 10^k) et 3 a 5 graduations */
function axisScale(v) {
  if (v <= 0) return { max: 1, step: 0.25, n: 4 };
  var p = Math.pow(10, Math.floor(Math.log10(v)));
  var cands = [1, 2, 2.5, 5, 10, 20, 25, 50].map(function (m) { return m * p / 10; });
  for (var i = 0; i < cands.length; i++) { var st = cands[i], n = Math.ceil(v / st - 1e-9); if (n >= 3 && n <= 5) return { max: n * st, step: st, n: n }; }
  return { max: niceMax(v), step: niceMax(v) / 4, n: 4 };
}
function chartWidth() { return (window.innerWidth || 1000) < 700 ? 420 : 720; }
function roundTop(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  if (h <= 0) return '';
  return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' -' + r + 'h' + (w - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + 'V' + (y + h) + 'z';
}
function tipAttr(text) { return ' data-tip="' + esc(text) + '" tabindex="0"'; }

/* colonnes empilees audit / ascension / upsell */
function columnChart(buckets, opts) {
  opts = opts || {};
  var W = chartWidth(), H = 250, padL = 46, padR = 12, padT = 14, padB = 30;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var total = function (b) { return (b.audit || 0) + (b.asc || 0) + (b.upsell || 0); };
  var sc = axisScale(Math.max.apply(null, buckets.map(total).concat([0])));
  var max = sc.max;
  var any = buckets.some(function (b) { return total(b) > 0; });
  var n = buckets.length, slot = innerW / n, bw = Math.min(24, slot * 0.62);
  var labelEvery = n <= 12 || (W < 500 && n <= 16) ? 1 : W < 500 ? 4 : 2;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria || 'Chiffre d’affaires facturé par période') + '">';
  for (var g = 0; g <= sc.n; g++) {
    var y = padT + innerH - innerH * g / sc.n;
    s += '<line class="' + (g === 0 ? 'axis' : 'grid-line') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + esc(fmtK(sc.step * g)) + '</text>';
  }
  buckets.forEach(function (b, i) {
    var x = padL + slot * i + (slot - bw) / 2;
    var baseY = padT + innerH;
    var tip = b.tipTitle + '\nCA facturé : ' + fmtEur(total(b)) + '\n3 mois ' + fmtEur(b.audit || 0) + ' | 6 mois ' + fmtEur(b.asc || 0) + ' | 12 mois ' + fmtEur(b.upsell || 0) + (b.products != null ? '\n' + b.products + ' ' + plural(b.products, 'produit signé', 'produits signés') : '');
    var segs = [{ v: b.audit || 0, c: 'var(--s1)' }, { v: b.asc || 0, c: 'var(--s3)' }, { v: b.upsell || 0, c: 'var(--s2)' }].filter(function (q) { return q.v > 0; });
    if (!segs.length) {
      s += '<rect class="hit" x="' + (padL + slot * i) + '" y="' + padT + '" width="' + slot + '" height="' + innerH + '"' + tipAttr(b.tipTitle + '\nAucune saisie') + '/>';
    } else {
      var yCur = baseY;
      segs.forEach(function (q, j) {
        var h = innerH * q.v / max;
        var top = yCur - h;
        if (j === segs.length - 1) s += '<path class="bar" d="' + roundTop(x, top, bw, h, 4) + '" fill="' + q.c + '"' + tipAttr(tip) + '/>';
        else s += '<rect class="bar" x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" fill="' + q.c + '"' + tipAttr(tip) + '/>';
        yCur = top - 2;
      });
    }
    if (b.label != null && i % labelEvery === 0) {
      s += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (H - 9) + '" text-anchor="middle"' + (b.today ? ' fill="#fff" font-weight="500"' : '') + '>' + esc(b.label) + '</text>';
    }
    if (b.today) s += '<circle cx="' + (padL + slot * i + slot / 2) + '" cy="' + (H - 1) + '" r="2" fill="var(--accent)"/>';
  });
  if (!any) s += '<text class="empty" x="' + (padL + innerW / 2) + '" y="' + (padT + innerH / 2) + '" text-anchor="middle" font-size="13">Aucune saisie sur la période</text>';
  s += '</svg>';
  return s;
}

/* cumul realise vs rythme objectif */
function cumulativeChart(points, target) {
  var W = chartWidth(), H = 230, padL = 46, padR = W < 500 ? 56 : 70, padT = 16, padB = 30;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var n = points.length;
  var maxV = Math.max(target || 0, Math.max.apply(null, points.map(function (p) { return p.cum == null ? 0 : p.cum; }).concat([0])));
  var sc = axisScale(maxV || 1), max = sc.max;
  var xs = function (i) { return n > 1 ? padL + innerW * i / (n - 1) : padL + innerW / 2; };
  var ys = function (v) { return padT + innerH - innerH * v / max; };
  var labelEvery = n <= 12 || (W < 500 && n <= 16) ? 1 : W < 500 ? 4 : 2;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumul du chiffre d’affaires facturé comparé au rythme de l’objectif">';
  for (var g = 0; g <= sc.n; g++) {
    var y = ys(sc.step * g);
    s += '<line class="' + (g === 0 ? 'axis' : 'grid-line') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + esc(fmtK(sc.step * g)) + '</text>';
  }
  if (target > 0 && n > 1) {
    s += '<line class="line" x1="' + xs(0) + '" y1="' + ys(0) + '" x2="' + xs(n - 1) + '" y2="' + ys(target) + '" stroke="rgba(255,255,255,.28)" stroke-dasharray="4 5"/>';
    s += '<text x="' + (xs(n - 1) + 8) + '" y="' + (ys(target) + 4) + '" fill="rgba(255,255,255,.6)">Objectif ' + esc(fmtK(target)) + '</text>';
  }
  var actual = points.filter(function (p) { return p.cum != null; });
  if (actual.length) {
    var d = '';
    actual.forEach(function (p, j) { var i = points.indexOf(p); d += (j ? 'L' : 'M') + xs(i) + ' ' + ys(p.cum); });
    var firstI = points.indexOf(actual[0]), lastI = points.indexOf(actual[actual.length - 1]);
    s += '<path class="area" d="' + (d + 'L' + xs(lastI) + ' ' + ys(0) + 'L' + xs(firstI) + ' ' + ys(0) + 'z') + '" fill="var(--s1)"/>';
    s += '<path class="line" d="' + d + '" stroke="var(--s1)"/>';
    var last = actual[actual.length - 1];
    s += '<circle class="marker" cx="' + xs(lastI) + '" cy="' + ys(last.cum) + '" r="4.5" fill="var(--s1)"/>';
    var labelY = ys(last.cum) + 4;
    if (target > 0 && Math.abs(labelY - (ys(target) + 4)) < 14) labelY = ys(target) + 4 + (last.cum >= target ? -14 : 14);
    s += '<text x="' + (xs(lastI) + 8) + '" y="' + labelY + '" fill="#fff" font-weight="600">' + esc(fmtK(last.cum)) + '</text>';
  } else {
    s += '<text class="empty" x="' + (padL + innerW / 2) + '" y="' + (padT + innerH / 2) + '" text-anchor="middle" font-size="13">Aucune saisie sur la période</text>';
  }
  points.forEach(function (p, i) {
    if (p.label != null && (i % labelEvery === 0 || i === n - 1)) s += '<text x="' + xs(i) + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(p.label) + '</text>';
    var expected = target > 0 && n > 1 ? target * i / (n - 1) : null;
    var tip = p.tipTitle + '\nRéalisé cumulé : ' + (p.cum == null ? 'pas encore' : fmtEur(p.cum)) + (expected != null ? '\nRythme objectif : ' + fmtEur(expected) : '');
    var hx = n > 1 ? xs(i) - innerW / (n - 1) / 2 : padL, hw = n > 1 ? innerW / (n - 1) : innerW;
    s += '<rect class="hit" x="' + hx + '" y="' + padT + '" width="' + hw + '" height="' + innerH + '"' + tipAttr(tip) + '/>';
  });
  s += '</svg>';
  return s;
}

function sparkline(values) {
  var W = 120, H = 34, n = values.length;
  if (!n) return '';
  var max = Math.max.apply(null, values.concat([1]));
  var xs = function (i) { return n > 1 ? 4 + (W - 8) * i / (n - 1) : W / 2; };
  var ys = function (v) { return 4 + (H - 8) - (H - 8) * v / max; };
  var d = '';
  values.forEach(function (v, i) { d += (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1); });
  var last = values[n - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="' + d + 'L' + xs(n - 1).toFixed(1) + ' ' + (H - 4) + 'L4 ' + (H - 4) + 'z" fill="var(--s1)" opacity=".08"/>' +
    '<path d="' + d + '" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '<circle cx="' + xs(n - 1).toFixed(1) + '" cy="' + ys(last).toFixed(1) + '" r="3" fill="var(--s1)"/></svg>';
}

/* anneau : repartition du facture entre produits */
function donutSvg(parts, total, label) {
  var R = 40, C = 2 * Math.PI * R, gap = 3;
  var s = '<svg viewBox="0 0 100 100" class="donut" role="img" aria-label="' + esc(label) + '">';
  var nz = parts.filter(function (p) { return p.value > 0; });
  if (!nz.length || total <= 0) {
    s += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>';
  } else if (nz.length === 1) {
    s += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="' + nz[0].color + '" stroke-width="12"' + tipAttr(nz[0].label + ' : ' + fmtEur(nz[0].value) + ' (100 %)') + '/>';
  } else {
    var offset = 0;
    nz.forEach(function (p) {
      var len = C * p.value / total;
      var draw = Math.max(0, len - gap);
      s += '<circle cx="50" cy="50" r="' + R + '" fill="none" stroke="' + p.color + '" stroke-width="12" stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 50 50)"' + tipAttr(p.label + ' : ' + fmtEur(p.value) + ' (' + fmtPct(p.value / total) + ')') + '/>';
      offset += len;
    });
  }
  s += '<text x="50" y="47" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">' + esc(fmtK(total)) + '</text>';
  s += '<text x="50" y="61" text-anchor="middle" fill="rgba(255,255,255,.55)" font-size="8.5">facturé</text>';
  return s + '</svg>';
}

function funnelHtml(a) {
  var max = Math.max(a.plan, 1);
  var stages = [
    { l: 'RDV planifiés', v: a.plan, c: 'rgba(255,255,255,.22)' },

  ];
  var steps = [
    { t: 'Taux de show', v: a.showRate },

  ];
  var s = '<div class="funnel">';
  stages.forEach(function (st, i) {
    s += '<div class="funnel-row"><span class="fl">' + st.l + '</span><span><i class="fb" style="display:block;width:' + (100 * st.v / max).toFixed(1) + '%;background:' + st.c + '"' + tipAttr(st.l + ' : ' + st.v) + '></i></span><span class="fv">' + fmtInt(st.v) + '</span></div>';
    s += '<div class="funnel-step"><span></span><span>' + I.arrow + steps[i].t + '</span><span style="text-align:right">' + pctOrNa(steps[i].v) + '</span></div>';
  });
  /* derniere marche : produits signes, audit et ascension cote a cote */

    (a.ascWon > 0 ? '<i style="width:' + wB.toFixed(1) + '%;background:var(--s3)"' + tipAttr('6 mois signés : ' + a.ascWon) + '></i>' : '') +
    (a.upWon > 0 ? '<i style="width:' + wC.toFixed(1) + '%;background:var(--s2)"' + tipAttr('12 mois signés : ' + a.upWon) + '></i>' : '') +
    (a.products === 0 ? '<i style="width:2px;background:rgba(255,255,255,.3)"></i>' : '') + '</span><span class="fv">' + fmtInt(a.products) + '</span></div>';
  s += '<div class="funnel-split-legend"><span><i style="background:var(--s1)"></i>' + fmtInt(a.wins) + ' ' + plural(a.wins, 'coaching 3 mois', 'coachings 3 mois') + '</span><span><i style="background:var(--s3)"></i>' + fmtInt(a.ascWon) + ' ' + plural(a.ascWon, 'coaching 6 mois', 'coachings 6 mois') + '</span><span><i style="background:var(--s2)"></i>' + fmtInt(a.upWon) + ' ' + plural(a.upWon, 'coaching 12 mois', 'coachings 12 mois') + '</span></div>';
  s += '</div>';

function meterHtml(value, max, cls, pace) {
  var w = max > 0 ? clamp(100 * value / max, 0, 100) : 0;
  return '<div class="meter ' + (cls || '') + '"><i style="width:' + w.toFixed(1) + '%"></i>' + (pace != null && pace > 0 && pace < 1 ? '<span class="pace" style="left:' + (100 * pace).toFixed(1) + '%" title="Rythme attendu aujourd’hui"></span>' : '') + '</div>';
}

function deltaHtml(cur, prev, kind, type) {
  if (prev == null) return '<span class="delta flat">' + I.flat + ' ' + esc(prevLabel(type)) + '</span>';
  var diff = cur - prev;
  var cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  var icon = diff > 0 ? I.up : diff < 0 ? I.dn : I.flat;
  var txt;
  if (kind === 'eur') txt = prev > 0 ? (diff >= 0 ? '+' : '-') + fmtPct(Math.abs(diff) / prev) : (diff > 0 ? 'nouveau' : '0');
  else txt = (diff >= 0 ? '+' : '-') + fmtInt(Math.abs(diff));
  return '<span class="delta ' + cls + '">' + icon + ' ' + esc(txt) + ' <span class="faint">' + esc(prevLabel(type)) + '</span></span>';
}
function kpiTile(o) {
  return '<div class="kpi"><div class="label"><span>' + esc(o.label) + '</span>' + (o.badge || '') + '</div>' +
    '<div class="value">' + o.value + '</div>' +
    '<div class="sub">' + (o.sub || '') + '</div>' +
    (o.delta ? '<div>' + o.delta + '</div>' : '') +
    (o.spark ? '<div class="spark">' + o.spark + '</div>' : '') + '</div>';
}
function pill(cls, text, icon) { return '<span class="pill pill-' + cls + '">' + (icon || '') + esc(text) + '</span>'; }
function subItem(label, value) { return '<span>' + esc(label) + ' <b>' + esc(value) + '</b></span>'; }

function dailySeries(r, closer, field, type) {
  var list = entriesIn(r, closer);
  if (type === 'year') {
    var out = [];
    for (var m = 0; m < 12; m++) { var ms = new Date(r.start.getFullYear(), m, 1), me = new Date(r.start.getFullYear(), m + 1, 0); out.push(sum(list.filter(function (e) { var d = parseKey(e.date); return d >= ms && d <= me; }), field)); }
    return out;
  }
  var days = [];
  for (var d = r.start; d <= r.end; d = addDays(d, 1)) if (isWorkday(d)) days.push(d);
  return days.map(function (d) { var k = keyOf(d); return sum(list.filter(function (e) { return e.date === k; }), field); });
}

function kpiRow(a, prev, type, r, closer) {
  var spark = dailySeries(r, closer, function (e) { return (+e.invAudit || 0) + (+e.invAsc || 0) + (+e.invUp || 0); }, type);

    kpiTile({ label: 'Cash encaissé', value: esc(fmtEur(a.cash)), sub: (a.cashRate == null ? '' : pill(cashCls, fmtPct(a.cashRate))) + '<span>du facturé encaissé</span>', delta: deltaHtml(a.cash, prev ? prev.cash : null, 'eur', type) }) +
    kpiTile({ label: 'Produits signés', value: esc(fmtInt(a.products)), sub: '<span><i class="dot-s1"></i>' + fmtInt(a.wins) + ' ' + plural(a.wins, 'coaching 3 mois', 'coachings 3 mois') + '</span><span><i class="dot-s3"></i>' + fmtInt(a.ascWon) + ' ' + plural(a.ascWon, 'coaching 6 mois', 'coachings 6 mois') + '</span><span><i class="dot-s2"></i>' + fmtInt(a.upWon) + ' ' + plural(a.upWon, 'coaching 12 mois', 'coachings 12 mois') + '</span><span>Close <b>' + esc(pctOrNa(a.closePitch)) + '</b> sur pitchés</span>', delta: deltaHtml(a.products, prev ? prev.products : null, 'int', type) }) +
    kpiTile({ label: 'RDV effectués', value: esc(fmtInt(a.done)) + '<small>/ ' + esc(fmtInt(a.plan)) + ' planifiés</small>', sub: subItem('Taux de show', pctOrNa(a.showRate)) + (a.absent ? '<span>' + a.absent + ' ' + plural(a.absent, 'conjoint absent', 'conjoints absents') + '</span>' : ''), delta: deltaHtml(a.done, prev ? prev.done : null, 'int', type) }) +
    kpiTile({ label: 'Panier par client', value: esc(a.basket == null ? 'n/a' : fmtEur(a.basket)), sub: subItem('3 mois', a.basketAudit == null ? 'n/a' : fmtEur(a.basketAudit)) + subItem('6 mois', a.basketAsc == null ? 'n/a' : fmtEur(a.basketAsc)) + subItem('12 mois', a.basketUp == null ? 'n/a' : fmtEur(a.basketUp)), delta: a.basket == null ? '' : deltaHtml(a.basket, prev && prev.basket ? prev.basket : null, 'eur', type) }) +
    '</div>';
}

function goalCard(a, r, type, closer) {
  var obj = objectiveFor(type, closer, r);
  var pace = paceInfo(r, type);
  var st = goalStatus(a.invoiced, obj.revenue, pace);
  var stW = goalStatus(a.products, obj.wins, pace);
  var pct = obj.revenue ? a.invoiced / obj.revenue : 0;
  var proj = projection(a.invoiced, pace);
  var projVal = proj == null ? (pace.over ? a.invoiced : null) : proj;
  var stP = projVal == null || !obj.revenue ? { cls: '' } : (projVal >= obj.revenue ? { cls: 'good' } : projVal >= obj.revenue * 0.85 ? { cls: 'warn' } : { cls: 'crit' });
  var remaining = Math.max(0, obj.revenue - a.invoiced);
  var daysLeft = Math.max(0, pace.total - pace.elapsed);
  var perDay = daysLeft > 0 ? remaining / daysLeft : 0;
  var statusLine = pill(st.cls, st.text, st.cls === 'good' ? I.check : st.cls === 'neutral' ? I.clock : I.alert) + ' ' +
    (pace.future ? 'La période n’a pas commencé.' : pace.over ? 'Période terminée : ' + esc(fmtEur(a.invoiced)) + ' facturés.' :
      esc(fmtEur(a.invoiced)) + ' facturés après ' + pace.elapsed + ' ' + plural(pace.elapsed, 'jour ouvré', 'jours ouvrés') + ' sur ' + pace.total + '.');
  return '<div class="card raised span-12"><div class="goal">' +
    /* bloc 1 : objectif facture */
    '<div class="goal-block main">' +
      '<div class="label">Objectif ' + esc(periodOf(type)) + (pace.prorated ? ', depuis ' + esc(pace.from.toLocaleDateString('fr-FR', { month: 'long' })) : '') + (closer ? '' : ' (équipe)') + '</div>' +
      '<div class="hero">' + esc(fmtPct(pct)) + '<small>de ' + esc(fmtK(obj.revenue)) + ' facturés</small></div>' +
      '<p class="lead">' + statusLine + '</p>' +
      meterHtml(a.invoiced, obj.revenue, st.cls === 'neutral' ? '' : st.cls, pace.frac) +
      '<div class="meter-legend"><span>' + esc(fmtEur(a.invoiced)) + '</span><span>' + (pace.frac > 0 && pace.frac < 1 ? 'Rythme attendu : ' + esc(fmtPct(pace.frac)) : '') + '</span><span>' + esc(fmtEur(obj.revenue)) + '</span></div>' +
    '</div>' +
    /* bloc 2 : produits signes */
    '<div class="goal-block">' +
      '<div class="label">Produits signés</div>' +
      '<div class="big">' + esc(fmtInt(a.products)) + '<small>/ ' + esc(fmtInt(obj.wins)) + ' visés</small></div>' +
      '<p class="lead muted">' + (obj.wins > a.products && !pace.over ? 'Encore ' + (obj.wins - a.products) + ' ' + plural(obj.wins - a.products, 'signature') + ' pour l’objectif.' : obj.wins <= a.products ? 'Objectif de signatures atteint.' : 'Période terminée.') + '</p>' +
      meterHtml(a.products, obj.wins, stW.cls === 'neutral' ? '' : stW.cls, pace.frac) +
      '<div class="meter-legend"><span><i class="dot-s1"></i>' + fmtInt(a.wins) + ' ' + plural(a.wins, 'coaching 3 mois', 'coachings 3 mois') + '</span><span><i class="dot-s3"></i>' + fmtInt(a.ascWon) + ' ' + plural(a.ascWon, 'coaching 6 mois', 'coachings 6 mois') + '</span><span><i class="dot-s2"></i>' + fmtInt(a.upWon) + ' ' + plural(a.upWon, 'coaching 12 mois', 'coachings 12 mois') + '</span></div>' +
    '</div>' +
    /* bloc 3 : projection */
    '<div class="goal-block">' +
      '<div class="label">Projection fin ' + esc(type === 'week' ? 'de semaine' : type === 'month' ? 'de mois' : 'd’année') + '</div>' +
      '<div class="big">' + esc(projVal == null ? 'n/a' : fmtK(projVal)) + '<small>' + (proj == null ? (pace.over ? 'réalisé' : '') : 'au rythme actuel') + '</small></div>' +
      '<p class="lead muted">' + (daysLeft > 0 && remaining > 0 && !pace.future ? 'Il reste ' + esc(fmtEur(remaining)) + ' à facturer, soit ' + esc(fmtEur(perDay)) + ' par jour ouvré sur ' + daysLeft + ' ' + plural(daysLeft, 'jour', 'jours') + '.' : remaining <= 0 ? 'Objectif dépassé de ' + esc(fmtEur(a.invoiced - obj.revenue)) + '.' : pace.future ? 'Le rythme se calcule dès la première journée saisie.' : 'Aucun jour ouvré restant sur la période.') + '</p>' +
      meterHtml(projVal == null ? 0 : projVal, obj.revenue, stP.cls) +
      '<div class="meter-legend"><span>Reste à encaisser (cumul) : <b style="color:#fff;font-weight:500">' + esc(fmtEur(outstandingAll(closer))) + '</b></span><span>' + esc(fmtEur(obj.revenue)) + '</span></div>' +
    '</div>' +
    '</div></div>';
}

function bucketsFor(type, r, closer) {
  var list = entriesIn(r, closer);
  var out = [];
  if (type === 'year') {
    for (var m = 0; m < 12; m++) {
      var ms = new Date(r.start.getFullYear(), m, 1), me = new Date(r.start.getFullYear(), m + 1, 0);
      var sub = list.filter(function (e) { var d = parseKey(e.date); return d >= ms && d <= me; });
      var a = agg(sub);
      out.push({ label: cap(ms.toLocaleDateString('fr-FR', { month: 'short' })), tipTitle: monthLabel(ms), audit: a.invAudit, asc: a.invAsc, upsell: a.invUp, products: a.products, today: TODAY >= ms && TODAY <= me, start: ms, end: me });
    }
    return out;
  }
  for (var d = r.start; d <= r.end; d = addDays(d, 1)) {
    if (!isWorkday(d)) continue;
    var k = keyOf(d);
    var subd = list.filter(function (e) { return e.date === k; });
    var ad = agg(subd);
    out.push({ label: type === 'week' ? fmtDate(d, { weekday: 'short', day: 'numeric' }) : String(d.getDate()), tipTitle: cap(fmtDateLong(d)), audit: ad.invAudit, asc: ad.invAsc, upsell: ad.invUp, products: ad.products, today: sameDay(d, TODAY), start: d, end: d });
  }
  return out;
}
function cumulativePoints(buckets) {
  var cum = 0;
  return buckets.map(function (b) {
    var has = b.start <= TODAY;
    if (has) cum += (b.audit || 0) + (b.asc || 0) + (b.upsell || 0);
    return { label: b.label, tipTitle: b.tipTitle, cum: has ? cum : null };
  });
}

var SHARED = { ns: null, ready: false, readonly: false, downloads: null };

function bannerHtml() {
  var s = '';
  if (SHEETS.on && !SHEETS.loaded && !SHEETS.error) s += '<div class="banner"><span>' + I.clock + '</span><span class="grow">Chargement des journées depuis Google Sheets…</span></div>';

  if (SHEETS.on && STATE.pending > 0) s += '<div class="banner ro"><span>' + I.alert + '</span><span class="grow">' + STATE.pending + ' ' + plural(STATE.pending, 'saisie en attente', 'saisies en attente') + ' de synchronisation avec Google Sheets.</span><button class="btn btn-sm" data-action="retrysync">Synchroniser</button></div>';
  if (SHARED.readonly) s += '<div class="banner ro"><span>' + I.alert + '</span><span class="grow">Vue en lecture seule : vos saisies restent enregistrées sur cet appareil, elles ne sont pas partagées avec l’équipe.</span></div>';
  var v = effectiveViewer();
  if (v.preview) s += '<div class="banner preview"><span>' + I.gear + '</span><span class="grow">Vous voyez l’outil comme <b>' + esc(v.name) + '</b> : ses commissions et ses lignes produit, pas celles des autres. Les saisies restent désactivées dans cet aperçu.</span><button class="btn btn-sm" data-action="viewas" data-id="">Revenir à ma vue</button></div>';
  else if (SHEETS.on && SHEETS.loaded && v.role === 'unknown') s += '<div class="banner ro"><span>' + I.alert + '</span><span class="grow">Votre adresse <b>' + esc(v.email) + '</b> n’est rattachée à aucun membre de l’équipe : lecture seule, sans commissions. Demandez au head of sales de l’ajouter dans Réglages, Équipe.</span></div>';
  else if (SHEETS.on && SHEETS.loaded && v.role === 'anonymous') s += '<div class="banner ro"><span>' + I.alert + '</span><span class="grow">Identité inconnue : le déploiement doit être en « Toute personne de Papa in Shape » pour que chacun voie ses commissions. En attendant, les commissions ne s’affichent pas et le End of Day demande qui remplit.</span></div>';
  return s;
}
function legend3(extra) { return '<div class="legend"' + (extra || '') + '><span><i style="background:var(--s1)"></i>3 mois</span><span><i style="background:var(--s3)"></i>6 mois</span><span><i style="background:var(--s2)"></i>12 mois</span></div>'; }

function renderTeam() {
  var r = periodRange(UI.ptype, UI.anchor);
  var pr = periodRange(UI.ptype, shiftAnchor(UI.ptype, UI.anchor, -1));
  var list = entriesIn(r), a = agg(list), prevList = entriesIn(pr), prev = agg(prevList);
  var buckets = bucketsFor(UI.ptype, r);
  var obj = objectiveFor(UI.ptype, null, r);
  var s = '<div class="page-head"><div><p class="eyebrow">Où on en est, ' + esc(periodShort(UI.ptype)) + '</p><h1 class="title">Vue <strong>équipe</strong></h1></div>' + periodControl() + '</div>';
  s += '<div class="grid">';
  s += goalCard(a, r, UI.ptype, null);
  s += '<div class="span-12">' + kpiRow(a, prevList.length ? prev : null, UI.ptype, r, null) + '</div>';
  s += '<div class="card span-8"><div class="card-head"><div><h2 class="card-title">Chiffre d’affaires facturé</h2><p class="card-kicker">' + (UI.ptype === 'year' ? 'par mois' : 'par jour ouvré') + ', par durée de coaching (3, 6 et 12 mois)</p></div><div class="card-side">' + esc(list.length) + ' ' + plural(list.length, 'journée saisie', 'journées saisies') + '</div></div><div class="chart">' + columnChart(buckets) + '</div>' + legend3() + '</div>';
  s += '<div class="card span-4"><div class="card-head"><div><h2 class="card-title">Entonnoir R1</h2><p class="card-kicker">du RDV planifié au produit signé</p></div></div>' + funnelHtml(a) + '</div>';
  s += '<div class="card span-7"><div class="card-head"><div><h2 class="card-title">Cumul facturé vs objectif</h2><p class="card-kicker">le trait pointillé est le rythme à tenir</p></div><div class="card-side">Objectif ' + esc(fmtEur(obj.revenue)) + '</div></div><div class="chart">' + cumulativeChart(cumulativePoints(buckets), obj.revenue) + '</div><div class="legend"><span><i style="background:var(--s1)"></i>Réalisé cumulé</span><span><i class="line" style="background:rgba(255,255,255,.4)"></i>Rythme objectif</span></div></div>';
  s += cashCard(a, r, null);
  s += donutsCard(r);
  s += leaderboard(r);
  s += journalCard(list, 4, true);
  s += '</div>';
  return s;
}

function donutsCard(r) {
  var year = r.start.getFullYear();
  var months = [];
  for (var m = 0; m < 12; m++) {
    var ms = new Date(year, m, 1), me = new Date(year, m + 1, 0);
    var a = agg(closerEntries().filter(function (e) { var d = parseKey(e.date); return d >= ms && d <= me; }));
    var current = TODAY >= ms && TODAY <= me;
    if (a.invoiced > 0 || current) months.push({ d: ms, a: a, current: current, partial: current && TODAY < me });
  }
  var s = '<div class="card span-12"><div class="card-head"><div><h2 class="card-title">Répartition du facturé</h2><p class="card-kicker">par durée de coaching, mois par mois sur ' + year + '</p></div>' + legend3(' style="margin-top:0"') + '</div>';
  if (!months.length) return s + '<div class="empty-state"><b>Aucun mois facturé sur ' + year + '</b>Les anneaux apparaissent dès la première journée saisie.</div></div>';
  s += '<div class="donuts">';
  months.forEach(function (mo) {
    var a = mo.a;
    var parts = [{ label: '3 mois', value: a.invAudit, color: 'var(--s1)' }, { label: '6 mois', value: a.invAsc, color: 'var(--s3)' }, { label: '12 mois', value: a.invUp, color: 'var(--s2)' }];
    s += '<div class="donut-cell"><div class="donut-head"><b>' + esc(cap(mo.d.toLocaleDateString('fr-FR', { month: 'long' }))) + (mo.partial ? '<small>en cours</small>' : '') + '</b><span>' + esc(fmtEur(a.invoiced)) + '</span></div>' +
      donutSvg(parts, a.invoiced, 'Répartition du facturé ' + monthLabel(mo.d)) +
      '<div class="donut-legend">' + parts.map(function (p) { return '<span><i style="background:' + p.color + '"></i>' + esc(p.label) + '<b>' + (a.invoiced > 0 ? esc(fmtPct(p.value / a.invoiced)) : 'n/a') + '</b></span>'; }).join('') + '</div></div>';
  });
  return s + '</div></div>';
}

function cashCard(a, r, closer) {
  var cls = a.cashRate == null ? '' : a.cashRate >= 0.95 ? 'good' : a.cashRate >= 0.7 ? 'warn' : 'crit';
  var s = '<div class="card span-5"><div class="card-head"><div><h2 class="card-title">Encaissement</h2><p class="card-kicker">prélèvements passés sur le facturé des ventes de la période</p></div><div class="card-side">Reste à encaisser (cumul)<br><b style="color:#fff;font-weight:600;font-size:14px">' + esc(fmtEur(outstandingAll(closer))) + '</b></div></div>';
  s += '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:6px"><span style="font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1">' + esc(pctOrNa(a.cashRate)) + '</span><span class="muted">' + esc(fmtEur(a.cash)) + ' encaissés sur ' + esc(fmtEur(a.invoiced)) + ' facturés</span></div>';
  s += meterHtml(a.cash, a.invoiced, cls) + '<div class="meter-legend"><span>Encaissé</span><span>Facturé</span></div>';
  var canc = cancelledIn(entriesIn(r, closer));
  if (canc > 0) s += '<p class="muted" style="margin:10px 0 0;font-size:12.5px"><span class="cancel">' + esc(fmtEur(canc)) + ' annulés</span> sur les ventes de la période (mensualités qui ne rentreront pas, retirées du facturé).</p>';
  if (!closer) {
    s += '<div class="cash-rows" style="margin-top:18px">';
    leaderRows(r).forEach(function (row) {
      var ac = row.a;
      var cc = ac.cashRate == null ? '' : ac.cashRate >= 0.95 ? 'good' : ac.cashRate >= 0.7 ? 'warn' : 'crit';
      s += '<div class="cash-row"><span class="cn">' + avatar(row.c.id) + esc(row.c.name) + '</span><span>' + meterHtml(ac.cash, ac.invoiced, cc) + '</span><span class="cv"><b>' + esc(pctOrNa(ac.cashRate)) + '</b>' + esc(fmtK(ac.cash)) + ' / ' + esc(fmtK(ac.invoiced)) + '</span></div>';
    });
    s += '</div>';
  } else {
    s += '<div style="margin-top:18px" class="muted">' + (a.invoiced - a.cash > 0 ? esc(fmtEur(a.invoiced - a.cash)) + ' facturés sur la période restent à encaisser (mensualités à venir).' : 'Tout ce qui a été facturé sur la période est encaissé.') + '</div>';
  }

document.addEventListener('mouseout', function (ev) { var t = ev.target.closest && ev.target.closest('[data-tip]'); if (t) hideTip(); });
document.addEventListener('focusin', function (ev) { var t = ev.target.closest && ev.target.closest('[data-tip]'); if (t) { var r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', function (ev) { if (ev.target.closest && ev.target.closest('[data-tip]')) hideTip(); });

document.addEventListener('click', function (ev) {
  var el = ev.target.closest && ev.target.closest('[data-action],[data-step],[data-quick],[data-mtype],[data-cgroup]');
  if (!el) return;
  if (el.hasAttribute('data-step')) {
    var inp = document.getElementById('f-' + el.getAttribute('data-for')); if (!inp) return;
    inp.value = Math.max(0, (parseInt(inp.value, 10) || 0) + parseInt(el.getAttribute('data-step'), 10));
    if (inp.closest('#eod-form')) syncSaleLines();
    updateSummary(); return;
  }
  if (el.hasAttribute('data-cgroup')) {
    var fp = document.getElementById('product-form'); if (!fp) return;
    var g0 = el.getAttribute('data-cgroup'); fp.g.value = g0;
    fp.querySelectorAll('[data-cgroup]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-cgroup') === g0)); });
    if (!fp.name.value) fp.name.placeholder = g0 === 'audit' ? 'Ex. Coaching 3 mois' : g0 === 'asc' ? 'Ex. Coaching 6 mois' : 'Ex. Coaching 12 mois';
    return;
  }
  if (el.hasAttribute('data-quick')) {
    var inp2 = document.getElementById('f-' + el.getAttribute('data-for')); if (!inp2) return;
    inp2.value = (parseFloat(inp2.value) || 0) + parseFloat(el.getAttribute('data-quick')); updateSummary(); return;
  }
  if (el.hasAttribute('data-mtype')) {
    var f0 = document.getElementById('member-form'); if (!f0) return;
    var t0 = el.getAttribute('data-mtype'); f0.type.value = t0;
    f0.querySelectorAll('[data-mtype]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mtype') === t0)); });
    if (!f0.role.value || f0.role.value === 'Closer' || f0.role.value === 'Setter') f0.role.value = t0 === 'setter' ? 'Setter' : 'Closer';
    return;
  }
  var action = el.getAttribute('data-action');
  if (action === 'overlay') { if (ev.target === el) closeModal(); return; }
  if (el.tagName === 'A' && el.getAttribute('target') === '_blank') return;
  ev.preventDefault();
  switch (action) {
    case 'tab': UI.tab = el.getAttribute('data-tab'); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'ptype': UI.ptype = el.getAttribute('data-type'); render(); break;
    case 'pshift': UI.anchor = shiftAnchor(UI.ptype, UI.anchor, parseInt(el.getAttribute('data-n'), 10)); render(); break;
    case 'ptoday': UI.anchor = TODAY; render(); break;
    case 'jfilter': UI.journalFilter = el.getAttribute('data-closer'); render(); break;
    case 'comfilter': UI.comFilter = el.getAttribute('data-closer'); render(); break;
    case 'saverules': saveRules(); break;
    case 'saveteam': saveTeam(); break;
    case 'viewas': setViewAs(el.getAttribute('data-id') || ''); break;
    case 'addproduct': addProduct(); break;
    case 'toggleproduct': toggleProduct(el.getAttribute('data-id')); break;
    case 'eod': (function () { var v = effectiveViewer(); openEod(el.getAttribute('data-closer') || (v.role === 'member' ? v.id : (MEMBER_BY_ID[UI.tab] ? UI.tab : '')), el.getAttribute('data-date') || ''); })(); break;
    case 'pickcloser': (function () {
      var id = el.getAttribute('data-closer'); var f = document.getElementById('eod-form'); if (!f) return;
      var existing = findEntry(id, f.date.value);
      var wasExisting = f.closer.value && findEntry(f.closer.value, f.date.value);
      var typeChange = memberOf(id).type !== (f.getAttribute('data-kind') || 'closer');
      if (existing || wasExisting || typeChange) { openEod(id, f.date.value); return; }
      f.closer.value = id;
      f.querySelectorAll('[data-action="pickcloser"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-closer') === id)); });
      updateSummary(); })(); break;
    case 'addlink': (function () { var box = document.getElementById('links'); if (box) { box.insertAdjacentHTML('beforeend', linkRowHtml(null)); var last = box.lastElementChild.querySelector('input'); if (last) last.focus(); } })(); break;
    case 'removelink': el.closest('.link-row').remove(); updateSummary(); break;
    case 'saveeod': saveEod(); break;
    case 'deleteentry': if (el.getAttribute('data-confirmed')) deleteEntry(el.getAttribute('data-closer'), el.getAttribute('data-date')); else openConfirm('Supprimer cette journée ?', 'Les chiffres et le commentaire de cette journée seront retirés du suivi.', 'deleteentry', true, { closer: el.getAttribute('data-closer'), date: el.getAttribute('data-date') }); break;
    case 'settings': openSettings(); break;
    case 'about': openAbout(); break;
    case 'saveobj': saveObjectives(); break;
    case 'addmember': addMember(); break;
    case 'togglemember': toggleMember(el.getAttribute('data-id')); break;
    case 'export': csvExport(); break;
    case 'retrysync': SHEETS.error = ''; render(); syncFromServer(true); break;
    case 'resetlocal': if (el.getAttribute('data-confirmed')) resetLocal(); else openConfirm('Effacer vos saisies locales ?', 'Toutes les journées et objectifs enregistrés sur cet appareil seront supprimés.', 'resetlocal', true); break;
    case 'close': closeModal(); break;
  }
});
document.addEventListener('input', function (ev) {
  if (!ev.target.closest || !ev.target.closest('#eod-form')) return;
  var name = ev.target.getAttribute('name') || '';
  if (name === 'wins' || name === 'ascWon' || name === 'upWon') syncSaleLines();
  else if (name.indexOf('sale') === 0) updateSaleInfos();
  updateSummary();
});
document.addEventListener('change', function (ev) {
  if (ev.target && ev.target.id === 'f-date') {
    var f = document.getElementById('eod-form');
    if (f && f.closer.value) { var ex = findEntry(f.closer.value, f.date.value); if (ex) { openEod(f.closer.value, f.date.value); return; } }
    followDate(ev.target.getAttribute('data-prev') || '', ev.target.value); ev.target.setAttribute('data-prev', ev.target.value); updateSaleInfos(); updateSummary();
  }
  if (ev.target && ev.target.closest && ev.target.closest('.sale-line')) { updateSaleInfos(); updateSummary(); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && MODAL) closeModal();
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter' && MODAL && MODAL.kind === 'eod') saveEod();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'm-name') { ev.preventDefault(); addMember(); }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && SHEETS.on && SHEETS.loaded) syncFromServer(false); });

/* =========================================================
   13. Demarrage
   ========================================================= */
function restoreBackup(b) {
  /* si la publication n'a pas abouti, les saisies reviennent dans la surcouche locale */
  var embedded = {};
  EMBED.entries.forEach(function (e) { embedded[entryKey(e)] = e; });
  var local = readLocal(), changed = false;
  Object.keys(b.entries || {}).forEach(function (k) { var e = b.entries[k]; if (!embedded[k] || embedded[k].updatedAt !== e.updatedAt) { local.entries[k] = e; changed = true; } });
  (b.deleted || []).forEach(function (k) { if (embedded[k] && local.deleted.indexOf(k) < 0) { local.deleted.push(k); changed = true; } });
  if (b.objectives && JSON.stringify(b.objectives) !== JSON.stringify(EMBED.objectives)) { local.objectives = b.objectives; changed = true; }
  if (b.members && JSON.stringify(b.members) !== JSON.stringify(EMBED.closers)) { local.members = b.members; changed = true; }
  if (b.catalog && JSON.stringify(b.catalog) !== JSON.stringify(EMBED.catalog)) { local.catalog = b.catalog; changed = true; }
  if (b.rules && JSON.stringify(b.rules) !== JSON.stringify(EMBED.rules)) { local.rules = b.rules; changed = true; }
  if (changed) { writeLocal(local); refresh(); }
}
function defaultPeriod() {
  var r = periodRange(UI.ptype, UI.anchor);
  var list = closerEntries();
  if (!entriesIn(r).length && list.length) {
    /* la periode courante est vide : on ouvre la derniere periode saisie, sans depasser aujourd'hui */
    var last = parseKey(list[list.length - 1].date);
    var past = list.filter(function (e) { return parseKey(e.date) <= TODAY; });
    UI.anchor = past.length ? parseKey(past[past.length - 1].date) : last;
  }
}
SHEETS.on = !!GS;
if (SHEETS.on) { EMBED.entries = []; }
refresh();
(function init() {
  var after = readAfter();
  if (after && after.backup && !SHEETS.on) restoreBackup(after.backup);
  if (after) {
    if (after.tab) UI.tab = after.tab;
    if (after.ptype) UI.ptype = after.ptype;
    if (after.anchor) UI.anchor = parseKey(after.anchor);
  } else if (!SHEETS.on) {
    defaultPeriod();
  }
  render();
  if (after && after.toast) setTimeout(function () { showToast(after.toast); }, 300);
  if (SHEETS.on) {
    syncFromServer(true).then(function () { defaultPeriod(); render(); });
    setInterval(function () { if (!MODAL) syncFromServer(false); }, 60000);
  } else if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(function (ns) { if (ns) { SHARED.ns = ns; SHARED.ready = true; } }).catch(function () {});
    window.claude.use('downloads').then(function (ns) { if (ns) SHARED.downloads = ns; }).catch(function () {});
  }
  /* point d'acces technique (tests, integration) */
  window.__suivi = { build: function () { return buildDocument(publishableState()); }, entries: function () { return ENTRIES.slice(); }, state: function () { return STATE; }, members: function () { return plainMembers(); }, catalog: function () { return plainCatalog(); }, rules: function () { return RULES; }, commissions: function (id) { return commissionSummary(id || null); }, sync: function () { return syncFromServer(true); } };
})();

})();
